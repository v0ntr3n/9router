# Default OpenCode free-tier fingerprint profile (hot-patchable via <data_dir>/opencode_profile.toml)
user_agent = "opencode/1.18.31"
client_header = "cli"
project_header = "global"
anthropic_version = "2023-06-01"
base_url_chat = "https://opencode.ai/zen/v1/chat/completions"
base_url_responses = "https://opencode.ai/zen/v1/responses"
base_url_messages = "https://opencode.ai/zen/v1/messages"
env_marker = "<env>"

# Exact 17-cipher BoringSSL/Chrome ClientHello list (JA4 cipher hash: 5b57614c22b0)
cipher_list = [
  "TLS_AES_128_GCM_SHA256",
  "TLS_AES_256_GCM_SHA384",
  "TLS_CHACHA20_POLY1305_SHA256",
  "ECDHE-ECDSA-AES128-GCM-SHA256",
  "ECDHE-RSA-AES128-GCM-SHA256",
  "ECDHE-ECDSA-AES256-GCM-SHA384",
  "ECDHE-RSA-AES256-GCM-SHA384",
  "ECDHE-ECDSA-CHACHA20-POLY1305",
  "ECDHE-RSA-CHACHA20-POLY1305",
  "ECDHE-ECDSA-AES128-SHA",
  "ECDHE-RSA-AES128-SHA",
  "ECDHE-ECDSA-AES256-SHA",
  "ECDHE-RSA-AES256-SHA",
  "AES128-GCM-SHA256",
  "AES256-GCM-SHA384",
  "AES128-SHA",
  "AES256-SHA",
]

[model_endpoints]
"gpt-5-nano" = "responses"
"big-pickle" = "chat"
"glm-4.7-free" = "chat"
"kimi-k2.5-free" = "chat"
"minimax-m2.5-free" = "messages"
